<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>质检看板</title>
    <style>
        :root {
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            z-index: 100;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 70px 16px 20px;
            color: white;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.2);
            cursor: pointer;
        }

        .back-btn svg { width: 20px; height: 20px; color: white; }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
        }

        .header-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 100px;
        }

        .content::-webkit-scrollbar { display: none; }

        /* KPI 卡片 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .kpi-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .kpi-value.success { color: var(--success); }
        .kpi-value.primary { color: var(--primary); }
        .kpi-value.warning { color: var(--warning); }
        .kpi-value.error { color: var(--error); }

        .kpi-label {
            font-size: 12px;
            color: var(--fg-muted);
        }

        .kpi-trend {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        .kpi-trend.up { color: var(--success); }
        .kpi-trend.down { color: var(--error); }

        /* 图表区域 */
        .chart-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 14px;
        }

        .chart-placeholder {
            height: 160px;
            background: var(--bg);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }

        .chart-bar-group {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 16px;
            height: 120px;
            padding: 0 20px;
        }

        .chart-bar {
            width: 28px;
            border-radius: 4px 4px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        .chart-bar-fill {
            width: 100%;
            border-radius: 4px 4px 0 0;
            background: linear-gradient(180deg, var(--primary-light), var(--primary));
        }

        .chart-bar-label {
            font-size: 10px;
            color: var(--fg-subtle);
            margin-top: 6px;
            white-space: nowrap;
        }

        /* 最近记录 */
        .record-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
        }

        .record-more {
            font-size: 12px;
            color: var(--primary);
            cursor: pointer;
        }

        .record-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .record-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .record-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .record-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .record-dot.pass { background: var(--success); }
        .record-dot.fail { background: var(--error); }

        .record-info {
            flex: 1;
        }

        .record-code {
            font-size: 13px;
            font-weight: 600;
            color: var(--fg);
        }

        .record-desc {
            font-size: 11px;
            color: var(--fg-muted);
        }

        .record-result {
            font-size: 12px;
            font-weight: 600;
        }

        .record-result.pass { color: var(--success); }
        .record-result.fail { color: var(--error); }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 28px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 16px;
            cursor: pointer;
        }

        .nav-item.active .nav-icon { color: var(--primary); }
        .nav-item.active .nav-label { color: var(--primary); }

        .nav-icon {
            width: 22px;
            height: 22px;
            color: var(--fg-subtle);
        }

        .nav-label {
            font-size: 10px;
            color: var(--fg-subtle);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar" style="color: white;">
            <span>9:41</span>
            <div style="display:flex;gap:4px;align-items:center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <div class="page-header">
            <div class="header-top">
                <div class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5m7 7l-7-7 7-7"/>
                    </svg>
                </div>
                <h1 class="page-title">质检看板</h1>
            </div>
            <div class="header-subtitle">本月质量数据概览</div>
        </div>

        <main class="content">
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-value success">98.2%</div>
                    <div class="kpi-label">本月合格率</div>
                    <div class="kpi-trend up">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                        +0.5%
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value primary">156</div>
                    <div class="kpi-label">已检批次</div>
                    <div class="kpi-trend up">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                        +12
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value warning">3</div>
                    <div class="kpi-label">不合格批次</div>
                    <div class="kpi-trend down">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        -2
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-value error">2.1%</div>
                    <div class="kpi-label">不良率</div>
                    <div class="kpi-trend down">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        -0.3%
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <div class="chart-title">本月计划达成率趋势</div>
                <div class="chart-bar-group">
                    <div class="chart-bar">
                        <div class="chart-bar-fill" style="height: 60%;"></div>
                        <div class="chart-bar-label">W1</div>
                    </div>
                    <div class="chart-bar">
                        <div class="chart-bar-fill" style="height: 75%;"></div>
                        <div class="chart-bar-label">W2</div>
                    </div>
                    <div class="chart-bar">
                        <div class="chart-bar-fill" style="height: 85%;"></div>
                        <div class="chart-bar-label">W3</div>
                    </div>
                    <div class="chart-bar">
                        <div class="chart-bar-fill" style="height: 92%;"></div>
                        <div class="chart-bar-label">W4</div>
                    </div>
                </div>
            </div>

            <div class="record-section">
                <div class="record-header">
                    <div class="record-title">最近抽检记录</div>
                    <div class="record-more">查看更多</div>
                </div>
                <div class="record-list">
                    <div class="record-item">
                        <div class="record-dot pass"></div>
                        <div class="record-info">
                            <div class="record-code">WO-2024-0113</div>
                            <div class="record-desc">传感器模组 · 15件抽检</div>
                        </div>
                        <div class="record-result pass">合格</div>
                    </div>
                    <div class="record-item">
                        <div class="record-dot pass"></div>
                        <div class="record-info">
                            <div class="record-code">WO-2024-0111</div>
                            <div class="record-desc">控制器主板 · 20件抽检</div>
                        </div>
                        <div class="record-result pass">合格</div>
                    </div>
                    <div class="record-item">
                        <div class="record-dot fail"></div>
                        <div class="record-info">
                            <div class="record-code">WO-2024-0112</div>
                            <div class="record-desc">电源模块 · 10件抽检</div>
                        </div>
                        <div class="record-result fail">不合格</div>
                    </div>
                    <div class="record-item">
                        <div class="record-dot pass"></div>
                        <div class="record-info">
                            <div class="record-code">WO-2024-0110</div>
                            <div class="record-desc">显示屏模组 · 12件抽检</div>
                        </div>
                        <div class="record-result pass">合格</div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="nav-label">工作台</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
                <span class="nav-label">数据</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span class="nav-label">工单</span>
            </div>
            <div class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="nav-label">我的</span>
            </div>
        </nav>
    </div>
</body>
</html>
