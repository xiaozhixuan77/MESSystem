<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>产线列表</title>
    <style>
        :root {
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            z-index: 100;
        }

        .page-header {
            background: var(--surface);
            padding: 70px 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            cursor: pointer;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            color: var(--fg);
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--fg);
            flex: 1;
        }

        /* 状态标签 */
        .status-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .status-tabs::-webkit-scrollbar { display: none; }

        .status-tab {
            padding: 6px 14px;
            background: var(--bg);
            border-radius: 20px;
            font-size: 12px;
            color: var(--fg-muted);
            white-space: nowrap;
            cursor: pointer;
            font-weight: 500;
        }

        .status-tab.active {
            background: var(--primary);
            color: white;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 100px;
        }

        .content::-webkit-scrollbar { display: none; }

        /* 产线卡片 */
        .line-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }

        .line-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .line-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .line-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .line-icon svg {
            width: 22px;
            height: 22px;
            color: white;
        }

        .line-icon.error {
            background: linear-gradient(135deg, #FF8A80, var(--error));
        }

        .line-icon.idle {
            background: linear-gradient(135deg, #BDBDBD, #9E9E9E);
        }

        .line-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 2px;
        }

        .line-type {
            font-size: 11px;
            color: var(--fg-muted);
        }

        .line-status {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .line-status.running {
            background: #E8F5E9;
            color: var(--success);
        }

        .line-status.error {
            background: #FFEBEE;
            color: var(--error);
        }

        .line-status.idle {
            background: #F5F5F5;
            color: var(--fg-muted);
        }

        .line-status svg {
            width: 8px;
            height: 8px;
        }

        .line-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 12px;
            background: var(--bg);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }

        .line-stat {
            text-align: center;
        }

        .line-stat-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 2px;
        }

        .line-stat-label {
            font-size: 10px;
            color: var(--fg-muted);
        }

        .line-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .line-current {
            font-size: 12px;
            color: var(--fg-muted);
        }

        .line-current strong {
            color: var(--fg);
            font-weight: 600;
        }

        .line-btn {
            padding: 6px 14px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 28px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 16px;
            cursor: pointer;
        }

        .nav-item.active .nav-icon { color: var(--primary); }
        .nav-item.active .nav-label { color: var(--primary); }

        .nav-icon {
            width: 22px;
            height: 22px;
            color: var(--fg-subtle);
        }

        .nav-label {
            font-size: 10px;
            color: var(--fg-subtle);
            font-weight: 500;
        }
    </style>
</head>
