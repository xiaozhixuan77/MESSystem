<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 柔性组装MES</title>
    <style>
        :root {
            /* HarmonyOS 蓝色系 - 现代化升级 */
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;

            /* 中性色 */
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;

            /* 状态色 */
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;

            /* 尺寸系统 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            /* 阴影 */
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

            /* 字体 */
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 设备外框 */
        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
        }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        /* 状态栏 */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            z-index: 100;
        }

        .status-time {
            letter-spacing: 0.5px;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-icons svg {
            width: 18px;
            height: 18px;
        }

        /* 主内容区 */
        .content {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 70px 24px 40px;
            display: flex;
            flex-direction: column;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        /* Logo区域 */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(21, 101, 192, 0.3);
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--fg);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 13px;
            color: var(--fg-muted);
            font-weight: 400;
        }

        /* 登录卡片 */
        .login-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 24px;
            text-align: center;
        }

        /* 输入框 */
        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--fg);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--fg);
            background: var(--bg);
            transition: all 0.2s ease;
            font-family: var(--font-sans);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.1);
        }

        .input-field::placeholder {
            color: var(--fg-subtle);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--fg-subtle);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--fg-subtle);
            cursor: pointer;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.35);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* 安全提示 */
        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--fg-subtle);
        }

        .security-notice svg {
            width: 12px;
            height: 12px;
        }

        /* 角色切换 */
        .role-section {
            margin-top: auto;
            padding-top: 20px;
        }

        .role-title {
            font-size: 12px;
            color: var(--fg-muted);
            text-align: center;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .role-btn {
            padding: 12px 4px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--fg-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .role-btn:hover, .role-btn.active {
            background: var(--primary-subtle);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 底部指示条 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #000;
            border-radius: 3px;
            z-index: 1000;
        }

        /* 版本信息 */
        .version-info {
            text-align: center;
            font-size: 11px;
            color: var(--fg-subtle);
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <div class="content">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <h1 class="app-title">柔性组装MES</h1>
                <p class="app-subtitle">工业制造执行系统 · 教学仿真版</p>
            </div>

            <div class="login-card">
                <h2 class="login-title">账号登录</h2>

                <div class="input-group">
                    <label class="input-label">账号</label>
                    <div class="input-wrapper">
                        <input type="text" class="input-field" placeholder="请输入工号或手机号">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">密码</label>
                    <div class="input-wrapper">
                        <input type="password" class="input-field" placeholder="请输入密码">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <svg class="password-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                </div>

                <button class="login-btn">登 录</button>

                <div class="security-notice">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>安全加密传输保护</span>
                </div>
            </div>

            <div class="role-section">
                <div class="role-title">快速切换角色（演示）</div>
                <div class="role-grid">
                    <button class="role-btn active">班组长</button>
                    <button class="role-btn">操作员</button>
                    <button class="role-btn">质检员</button>
                    <button class="role-btn">管理员</button>
                </div>
                <div class="version-info">v2.0.1 · HarmonyOS NEXT</div>
            </div>
        </div>

        <div class="home-indicator"></div>
    </div>
</body>
</html>
