<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工作台 - 操作员</title>
    <style>
        :root {
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: white;
            z-index: 100;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 70px 20px 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .user-greeting { color: white; }

        .user-greeting .name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .user-greeting .role {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .scan-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .scan-btn svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        /* 当前任务卡片 */
        .current-task {
            background: rgba(255,255,255,0.12);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .task-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(76,175,80,0.2);
            border-radius: 12px;
            font-size: 11px;
            color: #81C784;
            font-weight: 500;
        }

        .task-status svg {
            width: 8px;
            height: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .task-code {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }

        .task-progress {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 68%;
            background: linear-gradient(90deg, #4CAF50, #81C784);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 600;
            color: white;
        }

        /* 快捷操作 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 8px;
            background: rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            cursor: pointer;
            border: none;
        }

        .action-icon {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon svg {
            width: 14px;
            height: 14px;
            color: var(--primary);
        }

        .action-label {
            font-size: 11px;
            color: white;
            font-weight: 500;
        }

        /* 内容区 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 100px;
        }

        .content::-webkit-scrollbar { display: none; }

        .section { margin-bottom: 20px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
        }

        .section-more {
            font-size: 12px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        /* 任务卡片 */
        .task-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
        }

        .task-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }

        .task-tag.pending {
            background: #FFF3E0;
            color: var(--warning);
        }

        .task-tag.running {
            background: #E8F5E9;
            color: var(--success);
        }

        .task-tag.report {
            background: var(--primary-subtle);
            color: var(--primary);
        }

        .task-time {
            font-size: 11px;
            color: var(--fg-subtle);
        }

        .task-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 4px;
        }

        .task-info {
            font-size: 12px;
            color: var(--fg-muted);
            margin-bottom: 12px;
        }

        .task-btn {
            width: 100%;
            height: 36px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .task-btn.primary {
            background: var(--primary);
            color: white;
        }

        .task-btn.success {
            background: var(--success);
            color: white;
        }

        .task-btn svg {
            width: 14px;
            height: 14px;
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 28px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 16px;
            cursor: pointer;
        }

        .nav-item.active .nav-icon { color: var(--primary); }
        .nav-item.active .nav-label { color: var(--primary); }

        .nav-icon {
            width: 22px;
            height: 22px;
            color: var(--fg-subtle);
        }

        .nav-label {
            font-size: 10px;
            color: var(--fg-subtle);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>9:41</span>
            <div style="display:flex;gap:4px;align-items:center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <header class="header">
            <div class="header-top">
                <div class="user-greeting">
                    <div class="name">王操作员</div>
                    <div class="role">A班组 · 早班 · 工位WS-03</div>
                </div>
                <div class="scan-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                    </svg>
                </div>
            </div>

            <div class="current-task">
                <div class="task-header">
                    <span class="task-status">
                        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                        进行中
                    </span>
                    <span class="task-code">WO-2024-0116</span>
                </div>
                <div class="task-title">控制器主板组装 - SMT贴片工序</div>
                <div class="task-progress">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-text">68%</span>
                </div>
            </div>

            <div class="quick-actions">
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                    </div>
                    <span class="action-label">报工</span>
                </div>
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <span class="action-label">异常上报</span>
                </div>
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M9 9h6v6H9z"/>
                        </svg>
                    </div>
                    <span class="action-label">SOP查看</span>
                </div>
            </div>
        </header>

        <main class="content">
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">我的任务</h2>
                    <a href="#" class="section-more">全部任务</a>
                </div>

                <div class="task-card">
                    <div class="task-card-header">
                        <span class="task-tag pending">待执行</span>
                        <span class="task-time">14:00 开始</span>
                    </div>
                    <div class="task-name">WO-0118 传感器模组后焊</div>
                    <div class="task-info">预计工时 2h · 数量 50件</div>
                    <button class="task-btn primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        扫码开工
                    </button>
                </div>

                <div class="task-card">
                    <div class="task-card-header">
                        <span class="task-tag report">待报工</span>
                        <span class="task-time">已完成加工</span>
                    </div>
                    <div class="task-name">WO-0115 电源模块测试</div>
                    <div class="task-info">良品 96件 · NG 4件 · 工时 3.5h</div>
                    <button class="task-btn success">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        提交报工
                    </button>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">产线动态</h2>
                    <a href="#" class="section-more">查看详情</a>
                </div>

                <div style="background: var(--surface); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-sm);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span style="font-size: 13px; font-weight: 600; color: var(--fg);">L1 柔性线</span>
                        <span style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--success);">
                            <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                            运行中
                        </span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center;">
                        <div>
                            <div style="font-size: 11px; color: var(--fg-muted); margin-bottom: 2px;">当前工单</div>
                            <div style="font-size: 13px; font-weight: 600; color: var(--fg);">WO-0116</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; color: var(--fg-muted); margin-bottom: 2px;">本班产量</div>
                            <div style="font-size: 13px; font-weight: 600; color: var(--fg);">136件</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; color: var(--fg-muted); margin-bottom: 2px;">良品率</div>
                            <div style="font-size: 13px; font-weight: 600; color: var(--success);">98.5%</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="nav-label">工作台</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
                <span class="nav-label">数据</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span class="nav-label">工单</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="nav-label">我的</span>
            </div>
        </nav>
    </div>
</body>
