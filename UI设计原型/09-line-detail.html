<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>产线详情 - L1柔性线</title>
    <style>
        :root {
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: white;
            z-index: 100;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 70px 16px 16px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.15);
            cursor: pointer;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .line-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
            flex: 1;
        }

        .line-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(76,175,80,0.2);
            border-radius: 20px;
            font-size: 12px;
            color: #81C784;
            font-weight: 500;
        }

        .line-status svg {
            width: 8px;
            height: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 当前工单 */
        .current-wo {
            background: rgba(255,255,255,0.12);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
        }

        .wo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .wo-code {
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        .wo-progress {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
        }

        .wo-title {
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 78%;
            background: linear-gradient(90deg, #4CAF50, #81C784);
            border-radius: 3px;
        }

        /* 操作按钮 */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 4px;
            background: rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            cursor: pointer;
            border: none;
        }

        .action-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon svg {
            width: 16px;
            height: 16px;
            color: var(--primary);
        }

        .action-label {
            font-size: 10px;
            color: white;
            font-weight: 500;
        }

        /* 内容区 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 20px;
        }

        .content::-webkit-scrollbar { display: none; }

        .section { margin-bottom: 16px; }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 12px;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .stat-label {
            font-size: 11px;
            color: var(--fg-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 4px;
        }

        .stat-trend {
            font-size: 11px;
            color: var(--success);
        }

        /* 工作站列表 */
        .station-list {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
        }

        .station-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .station-item:last-child {
            border-bottom: none;
        }

        .station-index {
            width: 28px;
            height: 28px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
        }

        .station-info {
            flex: 1;
        }

        .station-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 2px;
        }

        .station-status {
            font-size: 11px;
            color: var(--success);
        }

        .station-count {
            text-align: right;
        }

        .station-count-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
        }

        .station-count-label {
            font-size: 10px;
            color: var(--fg-muted);
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>9:41</span>
            <div style="display:flex;gap:4px;align-items:center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <header class="header">
            <div class="header-top">
                <div class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5m7 7l-7-7 7-7"/>
                    </svg>
                </div>
                <h1 class="line-title">L1 柔性线</h1>
                <div class="line-status">
                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                    运行中
                </div>
            </div>

            <div class="current-wo">
                <div class="wo-header">
                    <span class="wo-code">WO-2024-0116</span>
                    <span class="wo-progress">78%</span>
                </div>
                <div class="wo-title">控制器主板组装 - SMT贴片工序</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div class="action-grid">
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </div>
                    <span class="action-label">启动</span>
                </div>
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="4" width="4" height="16"/>
                            <rect x="14" y="4" width="4" height="16"/>
                        </svg>
                    </div>
                    <span class="action-label">停止</span>
                </div>
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                    </div>
                    <span class="action-label">复位</span>
                </div>
                <div class="action-btn">
                    <div class="action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <span class="action-label">异常</span>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="section">
                <h2 class="section-title">实时数据</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">今日产量</div>
                        <div class="stat-value">320</div>
                        <div class="stat-trend">↑ 12% 较昨日</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">良品率</div>
                        <div class="stat-value" style="color: var(--success)">98.5%</div>
                        <div class="stat-trend">↑ 0.5% 较昨日</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">运行时长</div>
                        <div class="stat-value">6.5h</div>
                        <div class="stat-trend">今日累计</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">异常次数</div>
                        <div class="stat-value" style="color: var(--error)">0</div>
                        <div class="stat-trend">今日无异常</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">工作站状态</h2>
                <div class="station-list">
                    <div class="station-item">
                        <div class="station-index">1</div>
                        <div class="station-info">
                            <div class="station-name">上料工作站</div>
                            <div class="station-status">运行正常</div>
                        </div>
                        <div class="station-count">
                            <div class="station-count-value">200</div>
                            <div class="station-count-label">已处理</div>
                        </div>
                    </div>
                    <div class="station-item">
                        <div class="station-index">2</div>
                        <div class="station-info">
                            <div class="station-name">贴片工作站</div>
                            <div class="station-status">运行正常</div>
                        </div>
                        <div class="station-count">
                            <div class="station-count-value">198</div>
                            <div class="station-count-label">已处理</div>
                        </div>
                    </div>
                    <div class="station-item">
                        <div class="station-index">3</div>
                        <div class="station-info">
                            <div class="station-name">回流焊工作站</div>
                            <div class="station-status">运行正常</div>
                        </div>
                        <div class="station-count">
                            <div class="station-count-value">195</div>
                            <div class="station-count-label">已处理</div>
                        </div>
                    </div>
                    <div class="station-item">
                        <div class="station-index">4</div>
                        <div class="station-info">
                            <div class="station-name">AOI检测工作站</div>
                            <div class="station-status">运行正常</div>
                        </div>
                        <div class="station-count">
                            <div class="station-count-value">192</div>
                            <div class="station-count-label">已处理</div>
                        </div>
                    </div>
                    <div class="station-item">
                        <div class="station-index">5</div>
                        <div class="station-info">
                            <div class="station-name">测试工作站</div>
                            <div class="station-status">运行正常</div>
                        </div>
                        <div class="station-count">
                            <div class="station-count-value">190</div>
                            <div class="station-count-label">已处理</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
