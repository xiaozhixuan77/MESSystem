<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽检录入</title>
    <style>
        :root {
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            z-index: 100;
        }

        .page-header {
            background: var(--surface);
            padding: 70px 16px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            cursor: pointer;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            color: var(--fg);
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--fg);
            flex: 1;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 100px;
        }

        .content::-webkit-scrollbar { display: none; }

        /* 工单信息卡片 */
        .wo-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .wo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .wo-code {
            font-size: 15px;
            font-weight: 700;
            color: var(--fg);
        }

        .wo-status {
            padding: 3px 10px;
            background: var(--primary-subtle);
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            color: var(--primary);
        }

        .wo-product {
            font-size: 13px;
            color: var(--fg-muted);
            margin-bottom: 12px;
        }

        .wo-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
            background: var(--bg);
            border-radius: var(--radius-md);
        }

        .wo-stat {
            text-align: center;
        }

        .wo-stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 2px;
        }

        .wo-stat-label {
            font-size: 10px;
            color: var(--fg-muted);
        }

        /* 抽检表单 */
        .form-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--fg);
            margin-bottom: 8px;
        }

        .form-hint {
            font-size: 11px;
            color: var(--fg-subtle);
            margin-left: 8px;
            font-weight: 400;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-group {
            flex: 1;
        }

        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--fg);
            background: var(--bg);
            text-align: center;
            font-weight: 600;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-unit {
            font-size: 12px;
            color: var(--fg-muted);
            text-align: center;
            margin-top: 4px;
        }

        /* 缺陷类型 */
        .defect-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .defect-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg);
            border-radius: var(--radius-md);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .defect-item.selected {
            border-color: var(--primary);
            background: var(--primary-subtle);
        }

        .defect-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .defect-item.selected .defect-checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }

        .defect-checkbox svg {
            width: 12px;
            height: 12px;
            color: white;
            display: none;
        }

        .defect-item.selected .defect-checkbox svg {
            display: block;
        }

        .defect-name {
            flex: 1;
            font-size: 14px;
            color: var(--fg);
        }

        .defect-count {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-btn {
            width: 28px;
            height: 28px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--fg);
            cursor: pointer;
        }

        .count-value {
            width: 32px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
        }

        /* 备注 */
        .textarea-field {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--fg);
            background: var(--bg);
            resize: none;
            font-family: var(--font-sans);
        }

        .textarea-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* 底部按钮 */
        .bottom-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px 28px;
            z-index: 100;
        }

        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>9:41</span>
            <div style="display:flex;gap:4px;align-items:center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <div class="page-header">
            <div class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5m7 7l-7-7 7-7"/>
                </svg>
            </div>
            <h1 class="page-title">抽检录入</h1>
        </div>

        <main class="content">
            <div class="wo-card">
                <div class="wo-header">
                    <span class="wo-code">WO-2024-0116</span>
                    <span class="wo-status">待抽检</span>
                </div>
                <div class="wo-product">控制器主板组装 · 操作员：王操作员</div>
                <div class="wo-stats">
                    <div class="wo-stat">
                        <div class="wo-stat-value">136</div>
                        <div class="wo-stat-label">申报良品</div>
                    </div>
                    <div class="wo-stat">
                        <div class="wo-stat-value">4</div>
                        <div class="wo-stat-label">申报NG</div>
                    </div>
                    <div class="wo-stat">
                        <div class="wo-stat-value">14</div>
                        <div class="wo-stat-label">建议抽检</div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">抽检结果</h2>
                <div class="form-group">
                    <label class="form-label">抽检数量<span class="form-hint">(建议按批量5%~10%)</span></label>
                    <input type="number" class="input-field" value="14">
                    <div class="input-unit">件</div>
                </div>

                <div class="form-group">
                    <label class="form-label">抽检结果</label>
                    <div class="input-row">
                        <div class="input-group">
                            <input type="number" class="input-field" value="13">
                            <div class="input-unit">良品</div>
                        </div>
                        <div class="input-group">
                            <input type="number" class="input-field" value="1" style="color: var(--error);">
                            <div class="input-unit">不良</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">不良类型</h2>
                <div class="defect-list">
                    <div class="defect-item selected">
                        <div class="defect-checkbox">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <span class="defect-name">外观缺陷</span>
                        <div class="defect-count">
                            <button class="count-btn">−</button>
                            <span class="count-value">1</span>
                            <button class="count-btn">+</button>
                        </div>
                    </div>
                    <div class="defect-item">
                        <div class="defect-checkbox">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <span class="defect-name">尺寸偏差</span>
                        <div class="defect-count">
                            <button class="count-btn">−</button>
                            <span class="count-value">0</span>
                            <button class="count-btn">+</button>
                        </div>
                    </div>
                    <div class="defect-item">
                        <div class="defect-checkbox">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <span class="defect-name">功能失效</span>
                        <div class="defect-count">
                            <button class="count-btn">−</button>
                            <span class="count-value">0</span>
                            <button class="count-btn">+</button>
                        </div>
                    </div>
                    <div class="defect-item">
                        <div class="defect-checkbox">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <span class="defect-name">装配不良</span>
                        <div class="defect-count">
                            <button class="count-btn">−</button>
                            <span class="count-value">0</span>
                            <button class="count-btn">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">备注说明</h2>
                <textarea class="textarea-field" placeholder="请输入不良描述或其他备注信息..."></textarea>
            </div>
        </main>

        <div class="bottom-actions">
            <button class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                提交抽检结果
            </button>
        </div>
    </div>
</body>
</html>
