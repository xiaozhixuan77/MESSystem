<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人中心</title>
    <style>
        :root {
            --primary: #1565C0;
            --primary-light: #42A5F5;
            --primary-dark: #0D47A1;
            --primary-subtle: #E3F2FD;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --fg: #1A1A2E;
            --fg-muted: #5A5A6E;
            --fg-subtle: #9A9AA8;
            --border: #E8EBF0;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --font-sans: -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans', 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .device-frame {
            width: 393px;
            height: 852px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 0 0 8px #1a1a1a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 28px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            z-index: 100;
        }

        /* 用户信息头部 */
        .user-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 70px 16px 24px;
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .user-detail {
            flex: 1;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-role {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 2px;
        }

        .user-id {
            font-size: 11px;
            opacity: 0.7;
        }

        /* 统计卡片 */
        .stats-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
        }

        .stat-card {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 14px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--fg-muted);
        }

        /* 菜单列表 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 100px;
        }

        .content::-webkit-scrollbar { display: none; }

        .menu-group {
            background: var(--surface);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-icon.blue { background: var(--primary-subtle); color: var(--primary); }
        .menu-icon.green { background: #E8F5E9; color: var(--success); }
        .menu-icon.orange { background: #FFF3E0; color: var(--warning); }
        .menu-icon.red { background: #FFEBEE; color: var(--error); }
        .menu-icon.purple { background: #F3E5F5; color: #7B1FA2; }

        .menu-icon svg {
            width: 18px;
            height: 18px;
        }

        .menu-text {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
        }

        .menu-arrow {
            width: 16px;
            height: 16px;
            color: var(--fg-subtle);
        }

        .menu-badge {
            padding: 2px 8px;
            background: var(--error);
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }

        /* 版本信息 */
        .version-info {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--fg-subtle);
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 28px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 16px;
            cursor: pointer;
        }

        .nav-item.active .nav-icon { color: var(--primary); }
        .nav-item.active .nav-label { color: var(--primary); }

        .nav-icon {
            width: 22px;
            height: 22px;
            color: var(--fg-subtle);
        }

        .nav-label {
            font-size: 10px;
            color: var(--fg-subtle);
            font-weight: 500;
        }
    </style>
</head>
<body>

            </div>
        </div>

        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar">王</div>
                <div class="user-detail">
                    <div class="user-name">王操作员</div>

        <div class="stats-bar">

                </div>
                <div class="menu-item">
                    <div class="menu-icon orange">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                </div>
            </div>

            <div class="menu-group">
                <div class="menu-item">
                    <div class="menu-icon blue">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </div>
                    <div class="menu-text">帮助中心</div>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                </div>

                    <div class="menu-text">关于系统</div>

                        <polyline points="9 18 15 12 9 6"/>

                </div>
            </div>

            <div class="menu-group">
                <div class="menu-item">
                    <div class="menu-icon red">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>

                    </div>
                    <div class="menu-text" style="color: var(--error);">退出登录</div>
                    <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            </div>

            <div class="version-info">
                <p>鸿蒙MES系统 v2.1.0</p>

            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>

</body>
