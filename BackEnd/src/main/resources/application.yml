spring:
  application:
    name: mes-system
  profiles:
    active: dev

server:
  port: 8080

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-mes-system-2024}
  expiration: 86400000

simulator:
  tick-interval: 1000
  good-rate: 0.95
  tick-thread-pool-size: 16