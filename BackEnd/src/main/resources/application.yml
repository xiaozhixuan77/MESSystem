spring:
  application:
    name: mes-system
  profiles:
    active: dev

server:
  port: 8080

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: your-256-bit-secret-key-here-mes-system-2024
  expiration: 86400000

simulator:
  tick-interval: 1000
  good-rate: 0.95